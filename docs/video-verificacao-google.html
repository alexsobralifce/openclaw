<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagoBox demo captions</title>
<style>
  /* Cartões de legenda para o vídeo da verificação do Google: abra em uma aba, mostre cada cartão por ~5 s (seta direita avança) e troque para a aba do app. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b0720; color: #eeebf7; font: 28px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; padding: 6vw; cursor: pointer; }
  main { max-width: 22em; }
  .step { font-size: 0.55em; letter-spacing: .12em; text-transform: uppercase; color: #fbbf24; margin: 0 0 0.6em; }
  h1 { font-size: 1.6em; line-height: 1.15; margin: 0 0 0.5em; text-wrap: balance; }
  p { margin: 0 0 0.6em; }
  .scope { display: inline-block; font: 0.6em ui-monospace, SFMono-Regular, Menlo, monospace; background: #231b49; border: 1px solid #352c63; border-radius: 8px; padding: 2px 10px; margin: 0 6px 6px 0; color: #c4bfdc; }
  .hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 13px; color: #6e6794; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="card" aria-live="polite"></main>
<div class="hint">Right arrow, space or click = next card · left arrow = previous</div>

<script>
var CARDS = [
  { step: "MagoBox", title: "Personal assistant for WhatsApp and web chat", lines: ["Demo video for Google OAuth verification.", "App: https://www.magobox.com.br"], scopes: ["gmail.modify", "calendar.events", "drive.readonly", "drive.file", "contacts.readonly"] },
  { step: "Step 1", title: "The user connects their Google account", lines: ["Next: Google's official consent screen, with every permission the app requests."] },
  { step: "Step 2 · gmail.modify", title: "Read, organize and reply to email", lines: ["The user asks the assistant to read emails, then archives and deletes one, and replies.", "Sending only happens after the user confirms."] },
  { step: "Step 3 · calendar.events", title: "Show and create calendar events", lines: ["The user creates an event from a sentence and confirms it.", "The app only uses events in the primary calendar."] },
  { step: "Step 4 · drive.readonly", title: "Find and send back an existing file", lines: ["The user asks for a file that already exists in their Drive.", "The app only reads it. It never edits or deletes it."] },
  { step: "Step 5 · drive.file", title: "Save notes and documents in the app's own folder", lines: ["Notes and PDFs are saved in the folder the app created (Assist.IA) in the user's Drive.", "The app only touches files it created."] },
  { step: "Step 6 · contacts.readonly", title: "Look up a contact", lines: ["The user asks for a contact's phone number.", "Contacts are read-only: the app never changes them."] },
  { step: "Step 7", title: "The user disconnects Google", lines: ["Access is removed. The user can also revoke it at myaccount.google.com/permissions."] }
];
var i = 0, el = document.getElementById("card");
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function draw() {
  var c = CARDS[i];
  el.innerHTML = '<p class="step">' + esc(c.step) + "</p><h1>" + esc(c.title) + "</h1>" +
    c.lines.map(function (l) { return "<p>" + esc(l) + "</p>"; }).join("") +
    (c.scopes ? "<p>" + c.scopes.map(function (s) { return '<span class="scope">' + esc(s) + "</span>"; }).join("") + "</p>" : "");
}
function go(d) { i = Math.max(0, Math.min(CARDS.length - 1, i + d)); draw(); }
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
});
document.body.addEventListener("click", function (e) { go(e.clientX < window.innerWidth / 4 ? -1 : 1); });
draw();
</script>
</body>
</html>
