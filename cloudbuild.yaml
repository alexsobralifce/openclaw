# Constrói as imagens no Cloud Build (máquinas rápidas) em vez da e2-micro,
# onde o `pnpm install` levava mais de 20 minutos e falhava por timeout de rede.
# A VM só baixa a imagem pronta do Artifact Registry.
#
#   gcloud builds submit --region=us-central1 --config=cloudbuild.yaml \
#     --substitutions=_API_URL=http://34.133.1.75/api/v1,_SITE_URL=http://34.133.1.75 .

substitutions:
  _API_URL: http://34.133.1.75/api/v1
  _SITE_URL: http://34.133.1.75
  _REPO: us-central1-docker.pkg.dev/${PROJECT_ID}/openclaw

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s

steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.api", "-t", "${_REPO}/api:latest", "."]

  - id: web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - -t
      - ${_REPO}/web:latest
      - .

images:
  - ${_REPO}/api:latest
  - ${_REPO}/web:latest
